<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #64748b; font-size: 11px; letter-spacing: 3px; text-anchor: middle; text-transform: uppercase; }
      .footer { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #94a3b8; font-size: 12px; letter-spacing: 2px; text-anchor: middle; font-weight: 500; }
      .main-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #38bdf8; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-anchor: middle; }
      .name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #f8fafc; font-size: 18px; font-weight: 800; text-anchor: middle; }
      .role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #94a3b8; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-anchor: middle; }
      .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #e2e8f0; font-size: 10px; font-weight: 600; text-anchor: middle; }
      .node-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #f8fafc; font-size: 12px; font-weight: 700; }
      .node-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #94a3b8; font-size: 10px; }
      
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
        100% { transform: translateY(0px); }
      }
      @keyframes pulse-glow {
        0% { opacity: 0.3; }
        50% { opacity: 0.7; }
        100% { opacity: 0.3; }
      }
      .floating-card { animation: float 6s ease-in-out infinite; }
      .orbit-ring { fill: none; stroke: #38bdf8; stroke-opacity: 0.15; stroke-width: 1.5; stroke-dasharray: 4 6; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="450" rx="16" fill="url(#bg)"/>
  
  <!-- Subtle Grid/Stars -->
  <circle cx="150" cy="100" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="750" cy="80" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="800" cy="350" r="1" fill="#fff" opacity="0.2"/>
  <circle cx="100" cy="380" r="1.2" fill="#fff" opacity="0.3"/>

  <!-- Orbits / Connection Lines -->
  <ellipse cx="450" cy="210" rx="320" ry="110" class="orbit-ring"/>
  
  <!-- Direct Connector Lines to Nodes -->
  <path d="M 330 210 L 190 190" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
  <path d="M 330 190 L 230 120" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
  <path d="M 570 190 L 670 130" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
  <path d="M 570 210 L 710 200" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
  <path d="M 530 265 L 630 310" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Top & Bottom Header/Footer text -->
  <text x="450" y="40" class="title">A PERSONAL ENGINEERING SPACE</text>
  <text x="450" y="415" class="footer">LEARN • BUILD • BREAK • FIX • IMPROVE</text>

  <!-- CENTRAL CORE CARD -->
  <g class="floating-card" transform="translate(315, 125)">
    <!-- Glow effect behind card -->
    <rect x="-5" y="-5" width="280" height="150" rx="16" fill="#38bdf8" filter="url(#glow)" opacity="0.15"/>
    
    <!-- Card Body -->
    <rect width="270" height="140" rx="14" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    
    <!-- Header inside card -->
    <text x="135" y="28" class="main-title">DEVELOPER UNIVERSE</text>
    <line x1="45" y1="38" x2="225" y2="38" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1"/>

    <!-- Profile info -->
    <text x="135" y="60" class="name">MOHAMMED SHAHID</text>
    <text x="135" y="78" class="role">FULL-STACK • BUILDER • LEARNER</text>

    <!-- Inner Pills -->
    <g transform="translate(20, 96)">
      <rect width="70" height="24" rx="6" fill="#0369a1" fill-opacity="0.5" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1"/>
      <text x="35" y="16" class="pill-text">FOCUS JAVA</text>
    </g>
    <g transform="translate(100, 96)">
      <rect width="70" height="24" rx="6" fill="#0369a1" fill-opacity="0.5" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1"/>
      <text x="35" y="16" class="pill-text">BUILD WEB</text>
    </g>
    <g transform="translate(180, 96)">
      <rect width="70" height="24" rx="6" fill="#0369a1" fill-opacity="0.5" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1"/>
      <text x="35" y="16" class="pill-text">EXPLORE CLOUD</text>
    </g>
  </g>

  <!-- NODE 1: JAVA Backend (Left Mid) -->
  <g transform="translate(75, 170)" class="floating-card" style="animation-delay: 0.5s;">
    <rect width="115" height="45" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="22" cy="22" r="12" fill="#0284c7" fill-opacity="0.3"/>
    <text x="22" y="26" font-family="sans-serif" font-size="10" fill="#38bdf8" font-weight="bold" text-anchor="middle">☕</text>
    <text x="44" y="20" class="node-title">JAVA</text>
    <text x="44" y="34" class="node-sub">Backend</text>
  </g>

  <!-- NODE 2: NODE.JS Runtime (Top Left) -->
  <g transform="translate(160, 90)" class="floating-card" style="animation-delay: 1s;">
    <rect width="125" height="45" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="22" cy="22" r="12" fill="#166534" fill-opacity="0.4"/>
    <text x="22" y="26" font-family="sans-serif" font-size="9" fill="#4ade80" font-weight="bold" text-anchor="middle">JS</text>
    <text x="44" y="20" class="node-title">NODE.JS</text>
    <text x="44" y="34" class="node-sub">Runtime</text>
  </g>

  <!-- NODE 3: GIT Version Control (Top Right) -->
  <g transform="translate(615, 95)" class="floating-card" style="animation-delay: 1.5s;">
    <rect width="125" height="45" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="22" cy="22" r="12" fill="#312e81" fill-opacity="0.5"/>
    <text x="22" y="26" font-family="sans-serif" font-size="9" fill="#818cf8" font-weight="bold" text-anchor="middle">git</text>
    <text x="44" y="20" class="node-title">GIT</text>
    <text x="44" y="34" class="node-sub">Version Control</text>
  </g>

  <!-- NODE 4: REACT Frontend (Right Mid) -->
  <g transform="translate(710, 175)" class="floating-card" style="animation-delay: 2s;">
    <rect width="115" height="45" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="22" cy="22" r="12" fill="#581c87" fill-opacity="0.4"/>
    <text x="22" y="26" font-family="sans-serif" font-size="9" fill="#c084fc" font-weight="bold" text-anchor="middle">⚛</text>
    <text x="44" y="20" class="node-title">REACT</text>
    <text x="44" y="34" class="node-sub">Frontend</text>
  </g>

  <!-- NODE 5: MYSQL Database (Bottom Right) -->
  <g transform="translate(625, 280)" class="floating-card" style="animation-delay: 2.5s;">
    <rect width="125" height="45" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="22" cy="22" r="12" fill="#065f46" fill-opacity="0.4"/>
    <text x="22" y="26" font-family="sans-serif" font-size="9" fill="#34d399" font-weight="bold" text-anchor="middle">db</text>
    <text x="44" y="20" class="node-title">MYSQL</text>
    <text x="44" y="34" class="node-sub">Database</text>
  </g>
</svg>
