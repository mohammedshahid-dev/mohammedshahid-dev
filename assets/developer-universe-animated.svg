<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#050816"/>
    <stop offset="50%" stop-color="#0b1635"/>
    <stop offset="100%" stop-color="#02040c"/>
  </linearGradient>

  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#38bdf8"/>
    <stop offset="100%" stop-color="#6366f1"/>
  </linearGradient>

  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#8b5cf6"/>
    <stop offset="100%" stop-color="#06b6d4"/>
  </linearGradient>

  <radialGradient id="glow">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity=".35"/>
    <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
  </radialGradient>

  <filter id="shadow">
    <feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".35"/>
  </filter>

</defs>

<!-- Background -->
<rect width="1200" height="520" rx="28" fill="url(#bg)"/>

<!-- Ambient glow -->
<circle cx="170" cy="100" r="190" fill="url(#glow)"/>
<circle cx="1030" cy="420" r="220" fill="url(#glow)"/>

<!-- Stars -->
<g fill="#ffffff" opacity=".65">
  <circle cx="90" cy="90" r="2"/>
  <circle cx="230" cy="55" r="2"/>
  <circle cx="360" cy="110" r="1.5"/>
  <circle cx="520" cy="65" r="2"/>
  <circle cx="690" cy="105" r="1.5"/>
  <circle cx="840" cy="55" r="2"/>
  <circle cx="1050" cy="100" r="1.5"/>
  <circle cx="1130" cy="180" r="2"/>
  <circle cx="950" cy="310" r="1.5"/>
  <circle cx="1080" cy="390" r="2"/>
  <circle cx="120" cy="390" r="1.5"/>
  <circle cx="300" cy="450" r="2"/>
</g>

<!-- Orbit lines -->
<g fill="none" stroke="#38bdf8" stroke-opacity=".12">
  <ellipse cx="600" cy="270" rx="480" ry="175"/>
  <ellipse cx="600" cy="270" rx="390" ry="125"/>
  <ellipse cx="600" cy="270" rx="290" ry="85"/>
</g>

<!-- Central 3D-style card -->
<g filter="url(#shadow)">

  <rect x="300" y="105" width="600" height="300" rx="26"
        fill="#071126"
        stroke="#38bdf8"
        stroke-opacity=".35"/>

  <!-- top glass bar -->
  <rect x="300" y="105" width="600" height="55" rx="26"
        fill="#0c1b3d"
        stroke="#38bdf8"
        stroke-opacity=".18"/>

  <circle cx="330" cy="132" r="6" fill="#ef4444"/>
  <circle cx="350" cy="132" r="6" fill="#f59e0b"/>
  <circle cx="370" cy="132" r="6" fill="#22c55e"/>

  <text x="600" y="139"
        text-anchor="middle"
        fill="#94a3b8"
        font-family="Arial, sans-serif"
        font-size="13"
        letter-spacing="3">
    MOHAMMED SHAHID • DEVELOPER UNIVERSE
  </text>

  <!-- Main icon -->
  <circle cx="600" cy="235" r="65"
          fill="url(#purple)"
          opacity=".16"/>

  <circle cx="600" cy="235" r="48"
          fill="#0b1735"
          stroke="url(#blue)"
          stroke-width="2"/>

  <text x="600" y="249"
        text-anchor="middle"
        fill="#ffffff"
        font-family="Arial, sans-serif"
        font-size="42"
        font-weight="700">
    &lt;/&gt;
  </text>

  <!-- Name -->
  <text x="600" y="315"
        text-anchor="middle"
        fill="#ffffff"
        font-family="Arial, sans-serif"
        font-size="30"
        font-weight="700">
    MOHAMMED SHAHID
  </text>

  <text x="600" y="344"
        text-anchor="middle"
        fill="#7dd3fc"
        font-family="Arial, sans-serif"
        font-size="14"
        letter-spacing="4">
    FULL-STACK • JAVA • CLOUD
  </text>

</g>

<!-- Floating tech nodes -->
<g>

  <circle cx="160" cy="220" r="30"
          fill="#071126"
          stroke="#38bdf8"
          stroke-opacity=".55"/>

  <text x="160" y="226"
        text-anchor="middle"
        fill="#38bdf8"
        font-family="Arial"
        font-size="13"
        font-weight="700">
    JAVA
  </text>

  <circle cx="1040" cy="220" r="30"
          fill="#071126"
          stroke="#8b5cf6"
          stroke-opacity=".55"/>

  <text x="1040" y="226"
        text-anchor="middle"
        fill="#a78bfa"
        font-family="Arial"
        font-size="13"
        font-weight="700">
    CLOUD
  </text>

  <circle cx="215" cy="370" r="27"
          fill="#071126"
          stroke="#06b6d4"
          stroke-opacity=".55"/>

  <text x="215" y="376"
        text-anchor="middle"
        fill="#67e8f9"
        font-family="Arial"
        font-size="11"
        font-weight="700">
    SQL
  </text>

  <circle cx="985" cy="370" r="27"
          fill="#071126"
          stroke="#6366f1"
          stroke-opacity=".55"/>

  <text x="985" y="376"
        text-anchor="middle"
        fill="#818cf8"
        font-family="Arial"
        font-size="11"
        font-weight="700">
    WEB
  </text>

</g>

<!-- Connection lines -->
<g stroke="url(#blue)" stroke-opacity=".35" stroke-width="1">
  <line x1="190" y1="220" x2="300" y2="220"/>
  <line x1="900" y1="220" x2="1010" y2="220"/>
  <line x1="235" y1="370" x2="330" y2="345"/>
  <line x1="965" y1="370" x2="870" y2="345"/>
</g>

<!-- Bottom tagline -->
<text x="600" y="470"
      text-anchor="middle"
      fill="#64748b"
      font-family="Arial, sans-serif"
      font-size="13"
      letter-spacing="5">
  LEARN • BUILD • BREAK • FIX • IMPROVE
</text>

</svg>
