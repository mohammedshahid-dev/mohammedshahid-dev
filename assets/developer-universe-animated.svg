<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070B16"/>
    <stop offset=".52" stop-color="#101B36"/>
    <stop offset="1" stop-color="#070A12"/>
  </linearGradient>

  <radialGradient id="halo" cx=".5" cy=".5" r=".6">
    <stop offset="0" stop-color="#5E8CFF" stop-opacity=".24"/>
    <stop offset="1" stop-color="#5E8CFF" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#172646"/>
    <stop offset="1" stop-color="#0A1124"/>
  </linearGradient>

  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#83B0FF"/>
    <stop offset=".5" stop-color="#5D6FFF"/>
    <stop offset="1" stop-color="#B083FF"/>
  </linearGradient>

  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="16" stdDeviation="18"
      flood-color="#000000" flood-opacity=".5"/>
  </filter>
</defs>

<!-- BACKGROUND -->
<rect width="1200" height="520" rx="28" fill="url(#bg)"/>
<rect width="1200" height="520" rx="28" fill="url(#halo)"/>

<!-- GRID -->
<g opacity=".09" stroke="#AFC7FF">
  <path d="M80 80H1120"/>
  <path d="M80 140H1120"/>
  <path d="M80 200H1120"/>
  <path d="M80 260H1120"/>
  <path d="M80 320H1120"/>
  <path d="M80 380H1120"/>
  <path d="M80 440H1120"/>

  <path d="M140 50V470"/>
  <path d="M220 50V470"/>
  <path d="M300 50V470"/>
  <path d="M380 50V470"/>
  <path d="M460 50V470"/>
  <path d="M540 50V470"/>
  <path d="M620 50V470"/>
  <path d="M700 50V470"/>
  <path d="M780 50V470"/>
  <path d="M860 50V470"/>
  <path d="M940 50V470"/>
  <path d="M1020 50V470"/>
</g>

<!-- ORBIT RINGS -->
<g fill="none">
  <ellipse cx="600" cy="270" rx="450" ry="115"
    stroke="#78A2FF" stroke-opacity=".30" stroke-width="2"/>

  <ellipse cx="600" cy="270" rx="390" ry="175"
    transform="rotate(-18 600 270)"
    stroke="#A77DFF" stroke-opacity=".24" stroke-width="2"/>

  <ellipse cx="600" cy="270" rx="305" ry="210"
    transform="rotate(20 600 270)"
    stroke="#63D8FF" stroke-opacity=".13"/>
</g>

<!-- ORBIT POINTS -->
<circle cx="155" cy="270" r="5" fill="#79A6FF"/>
<circle cx="1045" cy="270" r="5" fill="#B184FF"/>
<circle cx="395" cy="92" r="4" fill="#64DDB0"/>
<circle cx="805" cy="448" r="4" fill="#79A6FF"/>

<!-- CONNECTIONS -->
<g stroke="#7EA7FF" stroke-opacity=".25" stroke-width="1.5">
  <path d="M255 264H395"/>
  <path d="M805 194H945"/>
  <path d="M380 92L455 150"/>
  <path d="M745 360L820 428"/>
</g>

<!-- FLOATING CARDS -->
<g filter="url(#shadow)" font-family="Arial,Segoe UI,sans-serif">

  <!-- JAVA -->
  <rect x="95" y="225" width="160" height="78" rx="16"
    fill="url(#card)" stroke="#638DFF" stroke-opacity=".65"/>

  <circle cx="125" cy="264" r="20" fill="#4D76E8"/>
  <text x="125" y="269" text-anchor="middle"
    fill="white" font-size="11" font-weight="700">JAVA</text>

  <text x="155" y="259" fill="white"
    font-size="14" font-weight="700">JAVA</text>
